services:
  db:
    image: postgres:17
    container_name: postgresql
    restart: always
    ports:
      - "5050:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./crear_tabla.sql:/docker-entrypoint-initdb.d/crear_tabla.sql:ro
    networks:
      - app-net

  web:
    image: nginx:alpine
    container_name: web
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - db
    volumes:
      - ./html:/usr/share/nginx/html:ro
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  pgdata: